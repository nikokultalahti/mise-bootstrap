"flatpak:io.github.flattool.Ignition" = "latest"
"flatpak:io.gitlab.adhami3310.Impression" = "latest"
"flatpak:org.gnome.World.PikaBackup" = "latest"
"flatpak:page.tesk.Refine" = "latest"
"flatpak:io.github.getnf.embellish" = "latest"
"flatpak:com.bitwarden.desktop" = "latest"
"flatpak:com.github.marhkb.Pods" = "latest"
"flatpak:org.gnome.Boxes" = "latest"
"flatpak:com.ranfdev.DistroShelf" = "latest"
"flatpak:org.mozilla.firefox" = "latest"
"flatpak:org.mozilla.thunderbird_esr" = "latest"
"flatpak:org.libreoffice.LibreOffice" = "latest"
"flatpak:dev.qwery.AddWater" = "latest"
"flatpak:io.github.qwersyk.Newelle" = "latest"
"flatpak:app.drey.Dialect" = "latest"
"flatpak:be.alexandervanhee.gradia" = "latest"
"flatpak:cafe.avery.Delfin" = "latest"
"flatpak:com.github.PintaProject.Pinta" = "latest"
"flatpak:com.github.jeromerobert.pdfarranger" = "latest"
"flatpak:com.nextcloud.desktopclient.nextcloud" = "latest"
"flatpak:com.yubico.yubioath" = "latest"
"flatpak:de.haeckerfelix.Fragments" = "latest"
