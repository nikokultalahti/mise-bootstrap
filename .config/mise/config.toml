# ==============================================================================
# MISE MASTER CONFIGURATION (.config/mise/config.toml)
# Manages: Tools, Packages (Flathub/Brew), Dotfiles, Systemd, and Auto-Sync
# ==============================================================================

[settings]
# Automatically check and update the mise executable in the background
auto_update = true
dotfiles.root = "$HOME/Dev/dotfiles"

# ==============================================================================
# VARIABLES
# Referenced in .tera templates as {{ vars.name }}, {{ vars.email }}, etc.
# ==============================================================================
[vars]
name = "Niko Kultalahti"

# Continuous history-watcher (watches tracked dotfiles for changes)
[bootstrap.services.mise-history]
builtin = "history-watch"

# ==============================================================================
# HOOK: PRE-PACKAGES
# Runs immediately BEFORE Phase 03 ([bootstrap.packages]).
# Configures Flathub, migrates any Fedora Flatpaks, and disables Fedora remote.
# ==============================================================================
[bootstrap.hooks.pre-packages]
run = """
#!/usr/bin/env bash
set -e

if [[ "$(uname -s)" == "Linux" ]] && command -v flatpak &>/dev/null; then
    echo "[-] Ensuring Flathub is added and prioritized [-]"
    
    # 1. Add full Flathub remote if missing
    flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

    # 2. Set Flathub priority high (10) so all app searches and instlls default to Flathub
    flatpak remote-modify --prio=10 flathub
    flatpak remote-modify --prio=1 fedora 2>/dev/null || true

    echo "[✓] Flathub is now the primary Flatpak repository"
fi
"""

# ==============================================================================
# PHASE 03: SYSTEM PACKAGES (mise bootstrap packages apply)
# Guaranteed to install exclusively from Flathub
# ==============================================================================
