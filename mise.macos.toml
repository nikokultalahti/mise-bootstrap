# ==============================================================================
# MISE MACOS PLATFORM CONFIGURATION
# Loaded automatically on macOS via auto_env
# ==============================================================================

# ==============================================================================
# SYSTEM PACKAGES (mise bootstrap packages apply)
# Installed via Homebrew on macOS
# ==============================================================================
[bootstrap.packages]
"brew:zsh-autosuggestions" = "latest"
"brew:zsh-syntax-highlighting" = "latest"

# ==============================================================================
# MACOS SPECIFIC TOOLS
# ==============================================================================
[tools]
"github:timrogers/litra-rs" = "latest"
"github:timrogers/litra-autotoggle" = "latest"
