# ==============================================================================
# MISE LINUX PLATFORM CONFIGURATION (Fedora Silverblue)
# Loaded automatically on Linux via auto_env
# ==============================================================================

# ==============================================================================
# HOOK: PRE-PACKAGES
# Runs immediately BEFORE bootstrap.packages.
# Configures Flathub, migrates any Fedora Flatpaks, and disables Fedora remote.
# ==============================================================================
[bootstrap.hooks.pre-packages]
run = "\"{{config_root}}/scripts/pre-packages.sh\""

# ==============================================================================
# SYSTEM PACKAGES (mise bootstrap packages apply)
# Guaranteed to install exclusively from Flathub
# ==============================================================================
[bootstrap.packages]
