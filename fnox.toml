# ==============================================================================
# FNOX CONFIGURATION (Secret Manager)
# Integrates with Bitwarden to expose secrets for mise bootstrap
# ==============================================================================
[providers.bitwarden]
type = "bitwarden"

[secrets]
GITHUB_SSH_KEY   = { provider = "bitwarden", value = "mise-github-auth-key/notes" }
DOTFILES_AGE_KEY = { provider = "bitwarden", value = "mise-age-key/notes" }
MISE_GITHUB_TOKEN = { provider = "bitwarden", value = "mise-github-token/notes"}
