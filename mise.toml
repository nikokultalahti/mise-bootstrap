# ==============================================================================
# MISE MASTER CONFIGURATION (Base Layer)
# Shared across both machines (personal and work).
# Role layers (mise.personal.toml / mise.work.toml) both activate explicitly
# via -E personal / -E work — neither is an implicit default. Each role file
# contains everything for that machine (tools, packages, system
# files/services/hooks) rather than being split further by OS — see
# mise.personal.toml's and mise.work.toml's own comments for why.
# ==============================================================================

[settings]
age.key_file = "$HOME/.config/age/dotfiles-age-key.txt"
auto_update = true

# ==============================================================================
# SHARED VARIABLES
# email_personal/email_work live here (flat, role-suffixed keys) rather than
# as a single "email" var in each role file: `mise dotfiles status` uses a
# restricted preview loader that doesn't fold a role file's [vars] into
# templates declared in this shared mise.toml (verified against mise
# 2026.9.12 — `mise dotfiles apply` merges them fine, but `status` reports a
# false-positive render error). Keeping everything this template needs in the
# same file it's declared in sidesteps that entirely, with no duplication of
# the [dotfiles] entries themselves across role files. Role selection uses
# mise's own builtin `mise_env` (see dotfiles/gitconfig.tera,
# dotfiles/zshrc.tera) instead of a custom machine_type var, for the same
# reason.
# ==============================================================================
[vars]
name = "Niko Kultalahti"
email_personal = "hello@nikokultalahti.com"
email_work = "niko.kultalahti@gapspgroup.com"

# ============================================================================================
# HOOK: POST-PACKAGES
# Runs immediately AFTER bootstrap.packages.
# Fetches secrets via fnox environment variables or falls back to Bitwarden CLI.
# ============================================================================================
[bootstrap.hooks.post-packages]
run = "\"$HOME/Dev/mise-bootstrap/scripts/post-packages-fetch-secrets.sh\""

# ==============================================================================
# DOTFILES & TEMPLATES (mise bootstrap dotfiles apply)
# ==============================================================================
[dotfiles]
# --- Self-managing Mise configs ---
# These three targets look inconsistent but each relies on a different mise
# mechanism, verified directly against mise 2026.9.10 behavior:
#
# - mise.toml -> conf.d/mise-bootstrap.toml: conf.d/*.toml is loaded
#   unconditionally, regardless of -E/persisted env — right for the common
#   layer. It's NOT symlinked to config.toml itself because `mise settings set`
#   (used by scripts/final.sh to persist the chosen profile) always writes to
#   ~/.config/mise/config.toml by default; that path must stay a real,
#   untracked, machine-local file, or every bootstrap run would dirty this
#   tracked file with an `env = [...]` line.
# - mise.personal.toml / mise.work.toml -> config.personal.toml /
#   config.work.toml: this literal config.<env>.toml naming is what makes
#   mise load a file only when -E <env> (or the persisted env setting)
#   matches. Putting these in conf.d/ instead would load both roles' tools
#   and packages on every machine at once — tested, confirmed unconditional.
"~/.config/mise/conf.d/mise-bootstrap.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/config.personal.toml"       = { source = "mise.personal.toml", mode = "symlink" }
"~/.config/mise/config.work.toml"           = { source = "mise.work.toml", mode = "symlink" }

# --- Static Configuration Files ---
"~/.config/atuin/config.toml"      = { source = "dotfiles/.config/atuin/config.toml", mode = "copy" }
"~/.config/bat"                    = { source = "dotfiles/.config/bat", mode = "copy" }
"~/.config/tealdeer/config.toml"   = { source = "dotfiles/.config/tealdeer/config.toml", mode = "copy" }
"~/.bashrc"                        = { source = "dotfiles/.bashrc", mode = "copy" }

# --- Dynamic Templates ---
"~/.zshrc"                         = { source = "dotfiles/zshrc.tera", mode = "template" }
"~/.zprofile"                      = { source = "dotfiles/zprofile.tera", mode = "template" }
"~/.gitconfig"                     = { source = "dotfiles/gitconfig.tera", mode = "template" }

[dotfiles."vscode/settings.json"]
source = "dotfiles/.config/vscode/settings.tera"
mode = "template"
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
  { os = "linux", target = "~/.config/Code/User/settings.json" }
]

[dotfiles."zed/settings.json"]
source = "dotfiles/.config/zed/settings.tera"
mode = "template"
variants = [
  { os = "linux", target = "~/.var/app/dev.zed.Zed/config/zed/settings.json" }
]

# ==============================================================================
# COMMON TOOLS (mise install)
# Shared across all machines (Linux and macOS)
# ==============================================================================
[tools]
"aqua:FiloSottile/age" = "latest"  # Required for decrypting files
"aqua:atuinsh/atuin" = "latest"
"aqua:sharkdp/bat" = "latest"
"aqua:bitwarden/clients" = "latest"
"aqua:carapace-sh/carapace-bin" = "latest"
"aqua:eza-community/eza" = "latest"
"aqua:sharkdp/fd" = "latest"
fnox = "latest"
"aqua:junegunn/fzf" = "latest"
"aqua:cli/cli" = "latest" # gh
"aqua:helix-editor/helix" = "latest"
"aqua:jqlang/jq" = "latest"
"aqua:earendil-works/pi" = "latest"
"aqua:pre-commit/pre-commit" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:koalaman/shellcheck" = "latest"
"aqua:getsops/sops" = "latest"
"aqua:starship/starship" = "latest"
"aqua:tealdeer-rs/tealdeer" = "latest"
"aqua:alexpasmantier/television" = "latest"
"aqua:mikefarah/yq" = "latest"
"aqua:ajeetdsouza/zoxide" = "latest"
"github:timrogers/litra-rs" = "latest"
"github:timrogers/litra-autotoggle" = "latest"

# ==============================================================================
# HOOK: POST-TOOLS - DECRYPT SYSTEM SECRETS
# Decrypts secrets using age immediately after tools are installed.
# mise_env[0] ("personal"/"work") is passed through so the script can gate the
# NextDNS part (personal + Linux only) without needing its own
# role-detection logic.
# ==============================================================================
[bootstrap.hooks.post-tools]
run = "\"$HOME/Dev/mise-bootstrap/scripts/post-tools-decrypt-secrets.sh\" {{ mise_env[0] }}"

# ==============================================================================
# FINAL HOOK (mise bootstrap final-hook)
# ==============================================================================
[bootstrap.hooks.final]
run = "\"$HOME/Dev/mise-bootstrap/scripts/final.sh\" {{ mise_env[0] }}"
