# ============================================================================================
# HOOK: POST-PACKAGES
# Runs immediately AFTER bootstrap.packages.
# 1. Configures GNOME Software for automatic background Flatpak updates.
# 2. Uses the newly installed Bitwarden Flatpak CLI to log in and fetch the AGE and SSH keys.
# ============================================================================================
[bootstrap.hooks.post-packages]
run = """
#!/usr/bin/env bash
set -e

# Set bw command to variable depending on whether running via Flatpak (Linux) or normal bw cli (MacOS)
if [[ "$(uname -s)" == "Linux" ]]; then
    BW_COMMAND="flatpak run --command=bw com.bitwarden.desktop"
fi

if [[ "$(uname -s)" == "Darwin" ]]; then
    BW_COMMAND="bw"
fi


if [[ "$(uname -s)" == "Linux" ]]; then
    # Enable GNOME Software background updates
    if command -v gsettings &>/dev/null; then
        gsettings set org.gnome.software download-updates true
        gsettings set org.gnome.software download-updates-notify true
        echo "[✓] Automatic GNOME Software updates turnead on"
    fi
fi

if [[ ! -f "$HOME/.config/age/dotfiles-age-key.txt" || ! -f "$HOME/.ssh/id_ed25519" ]]; then
    echo "[-] Checking Bitwarden authentication to fetch secrets [-]"
    
    # 1. Only configure server and login if NOT already authenticated
    if ! $BW_COMMAND login --check >/dev/null 2>&1; then
        $BW_COMMAND config server https://vault.bitwarden.eu
        $BW_COMMAND login
    else
        echo "[✓] Bitwarden already configured and logged in"
    fi

    # 2. Unlock vault for this session
    BW_SESSION=$($BW_COMMAND unlock --raw)

    # 3. Pull Age secret key if missing
    if [[ ! -f "$HOME/.config/age/dotfiles-age-key.txt" ]]; then
        mkdir -p "$HOME/.config/age"
        $BW_COMMAND get notes "dotfiles-age-key" --session "$BW_SESSION" > "$HOME/.config/age/dotfiles-age-key.txt"
        chmod 600 "$HOME/.config/age/dotfiles-age-key.txt"
        echo "[✓] Age secret key restored to ~/.config/age/dotfiles-age-key.txt"
    fi

    # 4. Pull GitHub SSH Key if missing
    if [[ ! -f "$HOME/.ssh/id_ed25519" ]]; then
        mkdir -p "$HOME/.ssh"
        chmod 700 "$HOME/.ssh"
        $BW_COMMAND get notes "dotfiles-github-auth-key" --session "$BW_SESSION" > "$HOME/.ssh/id_ed25519"
        chmod 600 "$HOME/.ssh/id_ed25519"

        touch "$HOME/.ssh/known_hosts"
        ssh-keyscan -t ed25519 github.com >> "$HOME/.ssh/known_hosts" 2>/dev/null
        echo "[✓] SSH key restored to ~/.ssh/id_ed25519"
    fi
fi
"""

# ==============================================================================
# SYSTEM FILES (mise bootstrap files apply)
# ==============================================================================
# Replaces /etc/rpm-ostreed.conf for automatic staged updates
[bootstrap.files."/etc/rpm-ostreed.conf"]
source = "system/rpm-ostreed.conf"
owner = "root"
mode = "0644"
notify = ["rpm-ostreed-automatic.timer"]

# Sets up repository for VSCode to be layered
[bootstrap.files."/etc/yum.repos.d/vscode.repo"]
source = "system/vscode.repo"
owner = "root"
mode = "0644"

# Ensure the directory exists for NextDNS config
[bootstrap.directories."/etc/systemd/resolved.conf.d"]
owner = "root"
mode = "0755"

# ==============================================================================
# SYSTEM SERVICES (mise bootstrap services apply)
# Converges systemd units (both system-level timers and user sockets)
# ==============================================================================
[bootstrap.services."rpm-ostreed-automatic.timer"]
# Enables and starts the staged OS update timer on Silverblue
state = "running"
enabled = true

[bootstrap.services."podman.socket"]
# Enables and starts the rootless Podman user socket for Dev Containers
state = "running"
enabled = true

# ==============================================================================
# LINUX SYSTEMD UNITS FOR AUTOMATIC UPDATES (Flatpaks, Mise Tools & Distrobox)
# Creates systemd units for zero-maintenance background updates
# ==============================================================================
[bootstrap.linux.systemd.units.workstation-auto-update]
description = "Automatic background update for Flatpaks, Mise tools, and Distrobox containers"
type = "oneshot"
exec_start = "/usr/bin/bash -c 'flatpak update -y --noninteractive && %h/.local/bin/mise upgrade --yes && (command -v distrobox-upgrade &>/dev/null && distrobox-upgrade --all || true)'"
start = false
wanted_by = []

[bootstrap.linux.systemd.units.workstation-auto-update-timer]
description = "Daily background update timer for Flatpaks, Mise tools, and Distrobox containers"
on_calendar = "daily"
randomized_delay_sec = "30m"
persistent = true
unit = "workstation-auto-update"

# ==============================================================================
# DOTFILES & TEMPLATES (mise bootstrap dotfiles apply)
# ==============================================================================
[dotfiles]
# --- Self-managing Mise config ---
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
"~/.config/mise/config.work.toml" = {source = "mise.work.toml", mode = "symlink" }

# --- Static Configuration Files ---
"~/.config/atuin/config.toml"           = { source = ".config/atuin/config.toml", mode = "copy" }
"~/.config/bat"                         = { source = ".config/bat", mode = "copy" }
"~/.config/tealdeer/config.toml"        = { source = ".config/tealdeer/config.toml", mode = "copy" }
"~/.bashrc"                             = { source = ".bashrc", mode = "copy" }

# --- Dynamic Templates ---
"~/.zshrc"                              = { source = "templates/zshrc.tera", mode = "template" }
"~/.zprofile"                           = { source = "templates/zprofile.tera", mode = "template" }
"~/.gitconfig"                          = { source = "templates/gitconfig.tera", mode = "template" }

[dotfiles."vscode/settings.json"]
source = ".config/vscode/settings.tera"
mode = "template" 
variants = [
  { os = "macos", target = "~/Library/Application Support/Code/User/settings.json" },
  { os = "linux", target = "~/.config/Code/User/settings.json" }
]

# ==============================================================================
# TOOLS (mise install)
# ==============================================================================
[tools]
age = "latest"            # Required for decrypting files
atuin = "latest"
bat = "latest"
carapace = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
jq = "latest"
pre-commit = "latest"
ripgrep = "latest"
shellcheck = "latest"
starship = "latest"
tealdeer = "latest"
television = "latest"
yq = "latest"
yt-dlp = "latest"
zoxide = "latest"
"github:timrogers/litra-rs" = "latest"
"github:timrogers/litra-autotoggle" = "latest"
"github:aaif-goose/goose" = "latest"

# ==============================================================================
# DECRYPT SYSTEM SECRETS
# Decrypts secrets using age immediately after tools are installed
# ==============================================================================
[bootstrap.hooks.post-tools]
run = """
#!/usr/bin/env bash
set -e

AGE_KEY="$HOME/.config/age/dotfiles-age-key.txt"

if [[ ! -f "$AGE_KEY" ]]; then
    echo "[!] Warning: Age key not found at $AGE_KEY; skipping decryption."
    exit 0
fi

# ------------------------------------------------------------------------------
# 1. Decrypt User SSH Config (~/.ssh/config)
# ------------------------------------------------------------------------------
ENCRYPTED_SSH="$HOME/Dev/dotfiles/.ssh/ssh_config_personal.age"
if [[ ! -f "$ENCRYPTED_SSH" && -f "$PWD/.ssh/ssh_config_personal.age" ]]; then
    ENCRYPTED_SSH="$PWD/.ssh/ssh_config_personal.age"
fi

DECRYPTED_SSH="$HOME/.ssh/config"

if [[ -f "$ENCRYPTED_SSH" ]]; then
    echo "[-] Decrypting ~/.ssh/config [-]"
    mkdir -p "$HOME/.ssh"
    chmod 700 "$HOME/.ssh"
    mise exec -- age -d -i "$AGE_KEY" "$ENCRYPTED_SSH" > "$DECRYPTED_SSH"
    chmod 600 "$DECRYPTED_SSH"
    echo "[✓] ~/.ssh/config decrypted"
fi

# ------------------------------------------------------------------------------
# 2. Decrypt System NextDNS Config (Linux only: /etc/systemd/resolved.conf.d/)
# ------------------------------------------------------------------------------

ENCRYPTED_DNS="$HOME/Dev/dotfiles/system/nextdns.age"
if [[ ! -f "$ENCRYPTED_DNS" && -f "$PWD/system/nextdns.age" ]]; then
    ENCRYPTED_DNS="$PWD/system/nextdns.age"
fi
DECRYPTED_DNS="/etc/systemd/resolved.conf.d/nextdns.conf"


if [[ "$(uname -s)" == "Linux" && -f "$ENCRYPTED_DNS" ]]; then

    echo "[-] Configuring NextDNS in systemd-resolved [-]"

    # Stream decrypt directly into destination (no plaintext ever touches /tmp)
    mise exec -- age -d -i "$AGE_KEY" "$ENCRYPTED_DNS" | sudo tee "$DECRYPTED_DNS" > /dev/null
    sudo chmod 644 "$DECRYPTED_DNS"

    # Restart systemd-resolved to apply the new DNS immediately
    sudo systemctl restart systemd-resolved
    echo "[✓] NextDNS configured and systemd-resolved restarted"
fi
"""

# ==============================================================================
# FINAL HOOK (mise bootstrap final-hook)
# ==============================================================================
[bootstrap.hooks.final]
run = """

# ------------------------------------------------------------------------------
# 1. Switch Git Origin from HTTPS to SSH
# ------------------------------------------------------------------------------
REPO_DIR="$HOME/Dev/dotfiles"

# Fallback to current working directory if ~/Dev/dotfiles is not where it was cloned
if [[ ! -d "$REPO_DIR/.git" && -d "$PWD/.git" ]]; then
    REPO_DIR="$PWD"
fi

if [[ -d "$REPO_DIR/.git" ]]; then
    CURRENT_ORIGIN=$(git -C "$REPO_DIR" remote get-url origin 2>/dev/null || true)
    if [[ "$CURRENT_ORIGIN" == https://github.com/* ]]; then
        echo "[-] Converting git origin from HTTPS to SSH in $REPO_DIR [-]"
        
        # Converts https://github.com/user/repo(.git) to git@github.com:user/repo.git
        SSH_ORIGIN="git@github.com:${CURRENT_ORIGIN#https://github.com/}"
        [[ "$SSH_ORIGIN" != *.git ]] && SSH_ORIGIN="${SSH_ORIGIN}.git"
        
        git -C "$REPO_DIR" remote set-url origin "$SSH_ORIGIN"
        echo "[✓] Git origin updated to: $SSH_ORIGIN"
    else
        echo "[✓] Git origin is already using SSH or custom remote"
    fi
fi

# ------------------------------------------------------------------------------
# 2. Persist Work Profile if applicable
# ------------------------------------------------------------------------------
{% if vars.machine_type == "work" %}
echo "[-] Persisting work environment settings [-]"
mise settings set env work
echo "[✓] Machine permanently configured with 'work' profile in config.local.toml"
{% endif %}

echo ""
echo "=================================================================="
echo "🎉 Bootstrap complete!" 
echo "=================================================================="
"""