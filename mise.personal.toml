# ==============================================================================
# MISE PERSONAL PROFILE (Fedora Silverblue)
# Activated via: mise -E personal bootstrap
# Everything for the personal machine lives here.
# The assumption is that Linux is used as personal machine.
# ==============================================================================
[vars]
email = "hello@nikokultalahti.com"
machine_type = "personal"

# ==============================================================================
# HOOK: PRE-PACKAGES
# Runs immediately BEFORE bootstrap.packages.
# Configures Flathub, migrates any Fedora Flatpaks, disables Fedora remote and
# sets Gnome Software automatic updates.
# ==============================================================================
[bootstrap.hooks.pre-packages]
run = "\"$HOME/Dev/mise-bootstrap/scripts/linux/pre-packages-config-flatpak-gnome.sh\""

# ==============================================================================
# PERSONAL CLI TOOLS (mise install)
# ==============================================================================
[tools]
"github:yt-dlp/yt-dlp" = "latest"
"github:aaif-goose/goose" = "latest"
"github:danielmiessler/fabric" = "latest"
"aqua:siderolabs/talos" = "latest"

# ==============================================================================
# PERSONAL PACKAGES (mise bootstrap packages apply)
# Guaranteed to install exclusively from Flathub.
# ==============================================================================
[bootstrap.packages]
"flatpak:org.gtk.Gtk3theme.adw-gtk3" = "latest"
"flatpak:org.gtk.Gtk3theme.adw-gtk3-dark" = "latest"
